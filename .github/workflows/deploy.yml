name: Deploy NeuraSense

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: neurasense-production-deploy
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify backend source compiles
        working-directory: backend
        run: python -m compileall app

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: /api/v1
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    needs: build-and-check
    runs-on:
      - self-hosted
      - linux
      - x64
      - neurasense
      - deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .artifacts/frontend-dist

      - name: Deploy to production directories
        env:
          FRONTEND_DIST_DIR: ${{ github.workspace }}/.artifacts/frontend-dist
        run: bash scripts/deploy_self_hosted.sh
