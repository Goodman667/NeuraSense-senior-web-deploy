name: Deploy NeuraSense

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: neurasense-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - neurasense
      - deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify backend source compiles
        working-directory: backend
        run: python -m compileall app

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: /api/v1
        run: npm run build

      - name: Deploy to production directories
        run: bash scripts/deploy_self_hosted.sh
