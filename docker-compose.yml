services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurasense-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${PUBLIC_API_BASE:-/api/v1}
    container_name: neurasense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
